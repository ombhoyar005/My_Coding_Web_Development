<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Expense Tracker</title>
        <link rel="stylesheet" href="Expense.css">
    </head>
<body>
    <div id="title">
        <h1>My Expense Tracker</h1>
        <h2>Track Your Monthly Spendings</h2>
    </div>
<div id="totalexpense" >
    <div class="accounts">
        <div class="expense">
            <h3>Total Amount :</h3>
            <p>25000 Rs</p>
        </div>
        <div class="expense">
            <h3>Total Used :</h3>
            <p>8500 Rs</p>
        </div>
        <button>Add Other Expenses</button>
    </div>    
    <table  cellspacing="20px" cellpadding="20px" >             
            
            
        <tr class="headings">
            <th style="background-color: salmon">Total Spent</th>
            <th style="background-color: salmon">Highest Category</th>
            <th style="background-color: salmon">This Month</th>
        </tr>    

        <tr>
            <td style="background-color: sandybrown">2000 Rs</td>
            <td style="background-color: sandybrown">Food</td>
            <td style="background-color: sandybrown">20th, May </td>
        </tr>
            
        <tr class="Spendings">
            <td style="background-color: sandybrown">1500 Rs</td>
            <td style="background-color: sandybrown">Health</td>
            <td style="background-color: sandybrown">25th, May</td>
        </tr>    

        <tr class="Spendings">
            <td style="background-color: sandybrown">5000 Rs</td>
            <td style="background-color: sandybrown">Shopping</td>
            <td style="background-color: sandybrown">29th, May</td>
        </tr>    
            
    </table>
</div>

</body>

</html>
