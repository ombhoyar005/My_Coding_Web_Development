<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Button</title>
    <style>
        body{
            background-color: #000000;
            justify-content: center;
            display: flex;
        }
        .btn{
            background-color: palegreen;
            width: 200px;
            height: 50px;
            text-align: center;
            margin-top: 20%;
            border-radius: 12px;
        }
        .btn button{
            text-align: center;
            justify-content: center;
            font-size: 20px;
            height: 50px ;
            color: blue;
            width: 200px;
            border: 1px solid black;
            background-color: palegreen;
            border-radius: 12px ;
            animation: button 3s infinite alternate ease-in-out;
        }
        @keyframes button{
            from{
                box-shadow: 0 0 10px palegreen, 0 0 20px palegreen;
            }
            to{
                box-shadow: 0 0 40px palegreen, 0 0 80px palegreen; 
            }
        }
    </style>
</head>
<body>
    <div class="btn">    
        <button>Enter</button>
    </div>
</body>
</html>
