<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout using Flexbox</title>
    <style>
        body{
            margin: 0;
            font-family: cursive;
            display: flex;
        }
        .layout{
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100vw;
        }
        .left{
            flex: 50%;
            background-color: red;
            padding: 20px;
            text-align: center;
            border-right: 1px solid #000000;
            text-decoration: underline orange;
        }
        .right{
            flex: 50%;
            padding: 20px;
            background-color: orange;
            border-left: 1px solid #000000;
            text-align: center;
            text-decoration: underline red;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="left">
            <h1>Left Column</h1>
        </div>
        <div class="right">
            <h1> Right Column</h1>
        </div>
    </div>
</body>
</html>
