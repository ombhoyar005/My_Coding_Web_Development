<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Footer Section</title>
    <style>
        body{
            gap: 20px;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: blanchedalmond;
        }
        .header{
            text-align: center;
            justify-content: center;
        }
        .foot{
            background-color: black;
            color: white;
            bottom: 0;
            margin-top: 200px;
            padding: 30px 20px;
            height: auto;
            flex: 100%;
            position: fixed;
            flex-direction: column;
            justify-content: space-between;
            flex-wrap: wrap;
            transition: 0.5s;
            width: 100%;
        }
        .foot p,.foot a{
            justify-content: center;
            color: white;
            text-decoration: none;
            display: block;

            margin: 8px 0;
        }
        .foot a:hover{
            transform: scale(1.05);
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome To Our WebPage</h1> 
    </header>
    <main>
        <h2>This is our Web Page</h2>
        <h2>You will feel very Gratefull</h2>
        <h2>After using this page</h2> 
    </main>
    <div class="foot">
        <footer>
            <a href="">Contact Us</a>
            <a href="">Support Us</a>
            <a href="">Follow Us</a>
            <a href="">Privacy Policy</a>
            <a href="">Terms of Service</a>
            <p>&copy; 2026 | All Rights are Reserved.</p>
        </footer>
    </div>
</body>
</html>
