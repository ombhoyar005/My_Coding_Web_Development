<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            
        }
        .navbar{
            display: flex;
            flex-direction: column;
            height: 550px;
            background-color: indianred;
            width: 200px;
            padding: 15px 20px;
            justify-content: space-between;
            align-items: center;
            border-right: 2px solid black;
           
        }
        .menu a{
            color: aliceblue;
            margin-top: 30px;
            margin-left: 50px;
            text-align: left;
            font-size: 18px;
            
            margin-bottom: 50%;
            flex-direction: column;
            text-decoration: none;
        }
        .menu a:hover{
            color: bisque;
            transition: 1s;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="menu">    
            <a href="http://127.0.0.1:5502/TASK_4&5.html"><img src="">Your Profile</a>
            <a href="">Home</a>
            <a href="">Support Us</a>
            <a href="">Contact Us</a>
        </div>
    </div>

</body>
</html>
