<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card with Product Card Design</title>
    <style>
        body{
            background-color: peru;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin: 0;
        }
        .card{
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;   
        }
        .profile{
            border: 2px solid yellowgreen;
            text-align: center;
            width: 200px;
            border-radius: 12px;
            margin-top: 50px;
            padding: 30px;
            background-color: thistle;
            text-align: center;
        }
        .profile img{
            height: 200px;
            width: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .btn{
            background-color: indigo;
            color: white;
            border: 1px solid black;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }
        .product {
            border: 2px solid yellowgreen;
            text-align: center;
            width: 200px;
            border-radius: 12px;
            margin-top: 50px;
            padding: 30px;
            box-shadow: 0 2px,4px black;
            background-color: thistle;
        }
        .product img{
            height: 100px;
            width: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .btn2{
            background-color: indigo;
            color: white;
            border: 1px solid black;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="profile">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSFQpQwti_Qc4OIQk8ul-dGsFMieBZjmj3mAjwsyeL403Fr0W1R1SP8Sh4&s" alt="Om Bhoyar">
            <h2>Om Bhoyar</h2>
            <p>Course - Web Development</p>
            <button class="btn">View Profile</button>
        </div>
        <div class="product">
            <img src="https://images.pexels.com/photos/30277522/pexels-photo-30277522.jpeg"style="width: 100%; height: 200px; object-fit: cover; border-radius: 12px;">
            <h2>Smartphone</h2>
            <button class="btn2">Add to Cart</button>
        </div>
    </div>
 
</body>
</html>
